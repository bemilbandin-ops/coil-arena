name: Presentation rebuild check

on:
  push:
    branches:
      - agent/presentation-rebuild-v2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify native 1920x1080 presentation
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/coil-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1920, height: 1080 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1200);

          const canvas = page.locator('canvas');
          const metrics = await canvas.evaluate(el => ({
            backingWidth: el.width,
            backingHeight: el.height,
            rect: el.getBoundingClientRect().toJSON(),
          }));
          console.log('canvas metrics', metrics);

          if (metrics.backingWidth !== 1920 || metrics.backingHeight !== 1080) {
            throw new Error(`Expected native 1920x1080 backing canvas, got ${metrics.backingWidth}x${metrics.backingHeight}`);
          }
          if (Math.abs(metrics.rect.x) > 1 || Math.abs(metrics.rect.y) > 1) {
            throw new Error(`Canvas clipped/offset at ${metrics.rect.x},${metrics.rect.y}`);
          }
          if (Math.abs(metrics.rect.width - 1920) > 1 || Math.abs(metrics.rect.height - 1080) > 1) {
            throw new Error(`Canvas CSS size mismatch ${metrics.rect.width}x${metrics.rect.height}`);
          }

          await page.screenshot({ path: 'menu-1920x1080.png', fullPage: true });

          // Existing PLAY button logical center = 251,520. Native mapping is 1.5x.
          await page.mouse.click(251 * 1.5, 520 * 1.5);
          await page.waitForTimeout(4200);
          await page.screenshot({ path: 'gameplay-1920x1080.png', fullPage: true });
          await browser.close();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-rebuild-screenshots
          path: |
            menu-1920x1080.png
            gameplay-1920x1080.png
